name: Diagnose ACL detection

# 一次性诊断工作流：在 CI 环境里复现 G1 的检测链路，打印每个中间值，
# 用于定位 LegacyAclCheck 在 CI 上检测到 0 条残留的原因。定位后可删除。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Reproduce G1 logic with full output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== 1. whoami /user（原始输出） ==='
          whoami /user
          Write-Host '=== 2. Environment.UserName ==='
          Write-Host $env:USERNAME
          Write-Host '=== 3. 施加 deny ==='
          $f = Join-Path $env:TEMP 'fg-acl-diag.txt'
          Set-Content -Path $f -Value 'game'
          icacls $f /deny "$($env:USERNAME):(RX)"
          Write-Host "deny exit code: $LASTEXITCODE"
          Write-Host '=== 4. icacls 显示输出 ==='
          icacls $f
          Write-Host '=== 5. icacls /save 内容 ==='
          $sddl = Join-Path $env:TEMP 'fg-acl-diag-sddl.txt'
          icacls $f /save $sddl
          Write-Host "save exit code: $LASTEXITCODE"
          Write-Host '--- 文件字节（前 8 个） ---'
          [System.IO.File]::ReadAllBytes($sddl)[0..7] | ForEach-Object { '{0:X2}' -f $_ }
          Write-Host '--- 文本内容 ---'
          Get-Content $sddl
          Write-Host '=== 6. 当前用户 SID（.NET 视角） ==='
          Write-Host ([System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)
